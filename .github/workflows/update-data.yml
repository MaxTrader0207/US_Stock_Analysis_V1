name: Update market data

on:
  schedule:
    # 美股開盤時段 (UTC 13:30-20:00, 台灣時間 21:30-04:00) 每小時更新熱力圖
    - cron: "15 13-23 * * 1-5"
    # 台股收盤後更新選股結果 (台灣時間 14:15 = UTC 06:15)
    - cron: "15 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

# 同一個 workflow 的所有觸發來源（每小時熱力圖排程、台股收盤排程、手動觸發）共用同一個
# concurrency group，確保任何時候最多只有一個在跑，其餘排隊等待，不會並行執行。
# 這是為了避免「跑得快的熱力圖排程」搶先 push，導致「跑得慢的選股排程/手動觸發」
# 最後 commit 時因為 main 分支已經被改過而 push 失敗（git push rejected: fetch first）。
concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      # 選配：資料異常時（完全沒有股票符合條件、或 Gemini 成功率過低）主動推播 LINE 通知。
      # 兩個都要設定才會生效，缺一個就只會印 [ALERT] log，不影響其他功能。
      # 需要的是 Messaging API 的 channel access token（不是已停用的 LINE Notify），
      # 申請方式：LINE Developers Console 建立 Messaging API channel 後在
      # 「Messaging API」頁籤取得長效 token；LINE_USER_ID 是你自己的 LINE 使用者ID。
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch heatmap data
        run: python scripts/fetch_heatmap.py

      # 強勢股選股 / 基本面選股只在「台股收盤後」那組排程或手動觸發時才跑，
      # 避免跟熱力圖共用同一個 workflow 時，被熱力圖的每小時排程誤觸發、
      # 一天多跑十幾次（fetch_screener.py 現在會呼叫 Gemini API，多跑會多花錢/多耗額度）。
      - name: Fetch screener data
        if: github.event.schedule == '15 6 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_screener.py

      - name: Fetch fundamentals data
        if: github.event.schedule == '15 6 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_fundamentals.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "沒有資料變化，不需要 commit"
            exit 0
          fi
          git commit -m "chore: update market data"
          # 保險機制：即使有 concurrency 擋著，仍保留重試，應對極少數的邊界情況
          # （例如 concurrency 排隊釋放的瞬間跟別的 push 撞上）。
          # 用 rebase 而不是 merge，保持 commit 歷史線性、乾淨。
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "push 成功（第 $i 次嘗試）"
              exit 0
            fi
            echo "push 失敗，等待後重試（第 $i 次）..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "已重試5次仍push失敗，放棄"
          exit 1
