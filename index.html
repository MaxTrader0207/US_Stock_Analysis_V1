<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>熱力圖｜Market Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  #heatmap-wrap{ padding:8px 8px 0; }
  #treemap{ width:100%; display:block; border-radius:14px; overflow:hidden; border:1px solid var(--border); background:var(--bg-panel); }
  .cell{ cursor:pointer; }
  .cell rect{ stroke:#0a0e14; stroke-width:1.5px; transition: filter .12s ease; }
  .cell:active rect{ filter:brightness(1.25); }
  .cell text{ pointer-events:none; font-family:var(--font-mono); fill:#0a0e14; }
  .cell .sym{ font-weight:700; }
  .sector-label{ pointer-events:none; font-family:var(--font-display); font-weight:700; fill:var(--text-dim); }

  .legend{ display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 14px 4px; font-family:var(--font-mono); font-size:10px; color:var(--text-dim); }
  .legend .bar{ width:100px; height:7px; border-radius:4px; background:linear-gradient(90deg, var(--accent-red), #3a4150, var(--accent-green)); }

  .detail-sheet{
    position:fixed; left:10px; right:10px; bottom: calc(62px + var(--safe-bottom));
    z-index:25;
    background: var(--bg-panel-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:11px 14px;
    transform: translateY(140%);
    opacity:0;
    transition: transform .22s cubic-bezier(.2,.8,.2,1), opacity .22s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .detail-sheet.show{ transform: translateY(0); opacity:1; }
  .detail-sheet .row1{ display:flex; justify-content:space-between; align-items:baseline; }
  .detail-sheet .sym{ font-family:var(--font-display); font-size:16px; font-weight:700; }
  .detail-sheet .name{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .detail-sheet .price{ font-family:var(--font-mono); font-size:18px; font-weight:600; text-align:right; }
  .detail-sheet .chg{ font-family:var(--font-mono); font-size:12px; text-align:right; margin-top:2px; }
</style>
</head>
<body>

<header class="app-header">
  <h1><span class="dot"></span><span id="map-title">S&amp;P 500 熱力圖</span></h1>
  <span class="meta" id="updated-meta">載入中…</span>
</header>

<main>
  <div class="pill-row" id="map-tabs"></div>
  <div class="legend">
    <span class="down">-3%</span>
    <span class="bar"></span>
    <span class="up">+3%</span>
    <span style="margin-left:8px;">方塊大小＝市值（期貨/加密貨幣為成交量）</span>
  </div>
  <div id="heatmap-wrap">
    <svg id="treemap"></svg>
  </div>
  <div id="empty" class="empty-state" style="display:none;">
    <strong>沒有可顯示的資料</strong>
    找不到對應的 data/heatmap_*.json，請確認 GitHub Actions 是否已產生資料檔。
  </div>
</main>

<div class="detail-sheet" id="detail-sheet">
  <div class="row1">
    <div>
      <div class="sym" id="d-sym">—</div>
      <div class="name" id="d-name">—</div>
    </div>
    <div>
      <div class="price" id="d-price">—</div>
      <div class="chg" id="d-chg">—</div>
    </div>
  </div>
</div>

<nav class="tabbar">
  <a href="index.html" class="active">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    熱力圖
  </a>
  <a href="screener.html">
    <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
    強勢股
  </a>
  <a href="fundamentals.html">
    <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"/></svg>
    基本面
  </a>
  <a href="ai-picks.html">
    <svg viewBox="0 0 24 24"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg>
    AI特選
  </a>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="js/heatmap.js"></script>
</body>
</html>
